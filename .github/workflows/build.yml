name: Build Frenova APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Dummy Google Services File if missing
        run: |
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"frenova"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example"}},"api_key":[{"current_key":""}]}]}' > app/google-services.json
          fi

      - name: Build Original APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -x test -x lint --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frenova-Original-APK
          path: app/build/outputs/apk/debug/*.apk
